<!doctype html>
<html lang="ko">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Brush+Script&family=Yeon+Sung&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              brush: ['"Yeon Sung"', '"Nanum Brush Script"', "cursive"],
              batang: ['"Gowun Batang"', "serif"],
            },
          },
        },
      };

    <style>
      body {
        font-family: "Gowun Batang", serif;
        background-color: #0a0a0a;
        color: #d4d4d8;
        overflow-x: hidden;
        background-image: url("https://www.transparenttextures.com/patterns/rice-paper.png");
        background-attachment: fixed;
      }
      .brush-font {
        font-family: "Yeon Sung", "Nanum Brush Script", cursive;
      }

      /* 낙엽 애니메이션 */
      .leaf {
        position: fixed;
        top: -50px;
        pointer-events: none;
        z-index: 50;
        animation: fall linear infinite;
        user-select: none;
      }
      @keyframes fall {
        0% {
          transform: translateY(-10px) translateX(-20px) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        50% {
          transform: translateY(50vh) translateX(20px) rotate(180deg);
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(100vh) translateX(-20px) rotate(360deg);
          opacity: 0;
        }
      }

      /* 애니메이션 */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 스크롤바 */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b;
      }
      ::-webkit-scrollbar-thumb {
        background: #7f1d1d;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #991b1b;
      }
    </style>
  </head>

      function enterWorld() {
        const entryScreen = document.getElementById("entryScreen");
        entryScreen.classList.add("opacity-0", "pointer-events-none");
        setTimeout(() => entryScreen.classList.add("hidden"), 1000);

        const main = document.getElementById("mainContent");
        main.classList.remove("opacity-0", "pointer-events-none");
        main.classList.add("opacity-100");

        const bgm = document.getElementById("bgm");
        bgm.volume = 0.3;
        bgm.play().catch((e) => console.log("Audio autoplay prevented:", e));

        renderContent();
        initLeaves();
      }

      function renderContent() {
        // 세계관 배경
        document.getElementById("worldBg").innerHTML = UNIVERSE_INFO.background
          .map((para) => `<p>${para}</p>`)
          .join("");

        // 환경 설정
        document.getElementById("worldSettings").innerHTML = `
                <li><span class="text-red-400 block mb-1">화폐</span> <span class="text-zinc-400 text-sm">${UNIVERSE_INFO.currency}</span></li>
                <li><span class="text-red-400 block mb-1">낙양 (중원)</span> <span class="text-zinc-400 text-sm">${UNIVERSE_INFO.luoyang}</span></li>
                <li><span class="text-red-400 block mb-1">무림맹 (정주)</span> <span class="text-zinc-400 text-sm">${UNIVERSE_INFO.wulinAlliance}</span></li>
            `;

        // 무의 경지
        document.getElementById("worldLevels").innerHTML = UNIVERSE_INFO.levels
          .map(
            (lvl) =>
              `<span class="px-3 py-1 bg-zinc-950 border border-zinc-800 text-zinc-400">${lvl}</span>`,
          )
          .join("");

        // 세력
        document.getElementById("factionList").innerHTML = FACTIONS.map(
          (faction) => `
                <div class="border border-zinc-800 bg-zinc-900/40 p-8 hover:bg-zinc-900/60 transition-colors">
                    <h3 class="text-3xl brush-font text-red-400 mb-2">${faction.name}</h3>
                    <p class="text-zinc-400 mb-6 font-light">${faction.description}</p>
                    <div class="grid sm:grid-cols-2 gap-4">
                        ${faction.members
                          .map(
                            (member) => `
                            <div class="space-y-1">
                                <h4 class="text-amber-200 font-medium">${member.name}</h4>
                                <p class="text-zinc-500 text-sm leading-relaxed">${member.desc}</p>
                            </div>
                        `,
                          )
                          .join("")}
                    </div>
                </div>
            `,
        ).join("");

        // 필터 버튼
        renderFilterButtons();

        // 인물 렌더링
        renderCharacters();
      }

      function renderFilterButtons() {
        document.getElementById("filterButtons").innerHTML = GROUPS.map(
          (group) => `
                <button 
                    onclick="setGroup('${group}')"
                    class="px-6 py-2 border brush-font text-xl transition-all duration-300 ${activeGroup === group ? "bg-red-900/40 border-red-500/50 text-amber-200" : "bg-zinc-900/50 border-zinc-800 text-zinc-500 hover:text-zinc-300 hover:border-zinc-600"}"
                >
                    ${group}
                </button>
            `,
        ).join("");
      }

      window.setGroup = function (group) {
        activeGroup = group;
        renderFilterButtons();
        renderCharacters();
      };

      function renderCharacters() {
        const grid = document.getElementById("characterGrid");
        const filtered =
          activeGroup === "전체"
            ? CHARACTERS
            : CHARACTERS.filter((c) => c.group === activeGroup);

        grid.innerHTML = filtered
          .map(
            (char) => `
                <div onclick="openModal('${char.id}')" class="group relative cursor-pointer aspect-[3/4] overflow-hidden bg-zinc-900 border border-zinc-800 hover:border-red-900/60 transition-colors duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/20 to-transparent z-10"></div>
                    <img 
                        src="${getImageUrl(char)}" 
                        alt="${char.name}"
                        loading="lazy"
                        class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700 bg-zinc-800"
                        onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(char.name)}&background=27272a&color=fcd34d&size=400';"
                    />
                    <div class="absolute bottom-0 left-0 p-6 z-20 w-full">
                        <div class="flex items-end justify-between mb-2">
                            <h3 class="text-3xl brush-font text-orange-200">${char.name}</h3>
                            <span class="text-xs text-red-500/80 mb-1 border border-red-900/50 px-2 py-0.5">${char.faction}</span>
                        </div>
                        <p class="text-sm text-zinc-400 font-medium truncate">${char.role} · ${char.level}</p>
                    </div>
                </div>
            `,
          )
          .join("");
      }

                    <img src="${getImageUrl(char)}" class="w-full h-full object-cover bg-zinc-800" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(char.name)}&background=27272a&color=fcd34d&size=400';">

                            <span class="text-zinc-500">경지</span><span class="font-medium text-red-400">${char.level}</span>
                        </div>
                        <div class="grid grid-cols-[80px_1fr] gap-4 text-left border-t border-zinc-800/50 pt-4 mt-4">
                            <span class="text-zinc-500">성격</span><span>${char.personality}</span>
                        </div>
                        <div class="grid grid-cols-[80px_1fr] gap-4 text-left border-t border-zinc-800/50 pt-4 mt-4">
                            <span class="text-zinc-500">화법</span><span class="italic text-zinc-400">"${char.speech}"</span>
                        </div>
                        ${
                          char.trait && char.trait !== "-"
                            ? `
                            <div class="grid grid-cols-[80px_1fr] gap-4 text-left border-t border-zinc-800/50 pt-4 mt-4">
                                <span class="text-amber-500/70">특징</span><span class="text-amber-100">${char.trait}</span>
                            </div>
                        `
                            : ""
                        }
                    </div>
                </div>
            `;
        const modal = document.getElementById("charModal");
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      };

      window.closeModal = function () {
        const modal = document.getElementById("charModal");
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      };

      function initLeaves() {
        const container = document.getElementById("leaves");
        const totalLeaves = 20;
        for (let i = 0; i < totalLeaves; i++) {
          const leaf = document.createElement("div");
          leaf.className = "leaf drop-shadow-md";
          leaf.innerHTML = "🍁";
          leaf.style.fontSize = `${12 + Math.random() * 16}px`;
          leaf.style.left = `${Math.random() * 100}vw`;
          leaf.style.animationDuration = `${8 + Math.random() * 7}s`;
          leaf.style.animationDelay = `${Math.random() * 5}s`;
          leaf.style.opacity = (0.6 + Math.random() * 0.4).toString();
          container.appendChild(leaf);
        }
      }
    </script>
  </body>
</html>
