  <style>
@layer base {
  body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: #030712;
    color: #f1f5f9;
  }
}

@layer utilities {
  /* Modern Magitech / Cyber-Fantasy Background */
  .magitech-bg {
    background-color: #030712;
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15) 0%, transparent 55%),
      radial-gradient(circle at 85% 90%, rgba(168, 85, 247, 0.10) 0%, transparent 45%),
      linear-gradient(180deg, #030712 0%, #081026 50%, #030712 100%);
  }

  /* Futuristic Sci-Fi/Magitech Fonts */
  .font-tech {
    font-family: 'Orbitron', 'Plus Jakarta Sans', sans-serif;
    letter-spacing: 0.05em;
  }

  .font-display {
    font-family: 'Outfit', 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
    letter-spacing: -0.01em;
  }

  .font-body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
  }

  .font-mono {
    font-family: 'JetBrains Mono', monospace;
  }

  /* Magitech HUD & Hologram Panels */
  .hud-panel {
    background: rgba(11, 19, 43, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(56, 189, 248, 0.25);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(6, 182, 212, 0.05);
  }

  .hud-panel-purple {
    background: rgba(18, 12, 36, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(168, 85, 247, 0.3);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(168, 85, 247, 0.08);
  }

  .hud-panel-amber {
    background: rgba(26, 18, 8, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(245, 158, 11, 0.3);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(245, 158, 11, 0.08);
  }

  /* Neon Glow Utilities */
  .glow-cyan {
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
  }

  .glow-purple {
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
  }

  .glow-amber {
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
  }

  .text-glow-cyan {
    text-shadow: 0 0 12px rgba(6, 182, 212, 0.8), 0 0 25px rgba(56, 189, 248, 0.4);
  }

  .text-glow-purple {
    text-shadow: 0 0 12px rgba(168, 85, 247, 0.8), 0 0 25px rgba(192, 132, 252, 0.4);
  }

  /* Subtle Magitech Hex / Grid Texture */
  .tech-grid {
    background-image: 
      linear-gradient(to right, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* Scanline overlay */
  .scanline-subtle {
    background: linear-gradient(
      rgba(18, 16, 16, 0) 50%, 
      rgba(0, 0, 0, 0.25) 50%
    );
    background-size: 100% 4px;
  }

  /* Glitch Text Animation */
  @keyframes glitchModern {
    0%, 100% { transform: none; opacity: 1; }
    92% { transform: none; opacity: 1; }
    93% { transform: skew(-1.5deg, 0.5deg) translate(-2px, 1px); opacity: 0.95; }
    94% { transform: skew(1.5deg, -0.5deg) translate(2px, -1px); filter: hue-rotate(45deg); }
    95% { transform: none; opacity: 1; filter: none; }
  }

  .animate-glitch-modern {
    animation: glitchModern 5s infinite;
  }

  /* Pulse Glow Animation */
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.8; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.02); }
  }

  .animate-pulse-glow {
    animation: pulseGlow 3s ease-in-out infinite;
  }
}

/* Custom Sleek Scrollbar */
::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}

::-webkit-scrollbar-track {
  background: #030712;
}

::-webkit-scrollbar-thumb {
  background: #1e293b;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #06b6d4;
}
